name = "ekaryandigitalsolution"
compatibility_date = "2024-12-01"

# Pages configuration
pages_build_output_dir = "./public"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "eka-ryan-digital-solution-db"
database_id = "91e5a4c5-92e1-4ae2-b027-cdab35724030"

# R2 Bucket binding
[[r2_buckets]]
binding = "R2"
bucket_name = "eka-ryan-digital-solution-assets"

# Environment variables
# NOTE: Set ADMIN_PASSWORD and JWT_SECRET via Cloudflare dashboard
# or use .dev.vars for local development (never commit secrets)
[vars]
ENVIRONMENT = "production"
